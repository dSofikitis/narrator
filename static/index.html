<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Narrator</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <div class="app">
        <header class="header">
            <div>
                <h1>Narrator</h1>
                <p>Paste text, pick a voice, and control playback sentence by sentence.</p>
            </div>
        </header>

        <main class="layout">
            <section class="panel">
                <div class="panel-header">
                    <h2>Text</h2>
                </div>
                <textarea id="textInput" placeholder="Paste or type your text here..."></textarea>
                <div class="actions">
                    <label class="file-button">
                        <input type="file" id="fileInput" accept=".txt,.md,.text,.rtf" />
                        Choose file
                    </label>
                </div>
            </section>

            <section class="panel">
                <div class="field">
                    <label for="voiceSelect">Voice</label>
                    <select id="voiceSelect"></select>
                </div>

                <div class="controls">
                    <button class="icon" id="backBtn" type="button">Back</button>
                    <button class="primary" id="playPauseBtn" type="button">
                        Play
                    </button>
                    <button class="icon" id="stopBtn" type="button">Stop</button>
                    <button class="icon" id="nextBtn" type="button">Next</button>
                </div>

                <div class="field">
                    <label for="speedSelect">Read speed</label>
                    <select id="speedSelect">
                        <option value="0.75">0.75x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.15">1.15x</option>
                        <option value="1.3">1.3x</option>
                        <option value="1.5">1.5x</option>
                    </select>
                </div>

                <div class="field">
                    <label for="volumeRange">Volume</label>
                    <div class="range-row">
                        <input type="range" id="volumeRange" min="0" max="1" step="0.05" value="0.85" />
                        <span id="volumeValue">85%</span>
                    </div>
                </div>

                <div class="status" id="statusText">Ready</div>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
