<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <title>Narrator by dSofikitis</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <header class="topbar">
        <div>
            <h1>NARRATOR</h1>
            <p class="tag"><span class="accent">&gt;</span> read anything aloud · neural voices via edge-tts<span class="cursor">█</span></p>
        </div>
        <button id="themeToggle" type="button" aria-label="Toggle theme" title="Toggle theme">
            <!-- sun (visible in dark mode = "switch to light") -->
            <svg class="icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="10" cy="10" r="3.5" />
                <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4" />
            </svg>
            <!-- moon (visible in light mode = "switch to dark") -->
            <svg class="icon-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 12.5A6.5 6.5 0 017.5 4a6.5 6.5 0 108.5 8.5z" />
            </svg>
        </button>
    </header>

    <main class="app">
        <!-- Left: text input panel -->
        <section class="panel">
            <span class="panel-label white grad-accent-to-text">[ /dev/text ]</span>

            <div class="field">
                <label class="field-label" for="textInput">input</label>
                <textarea id="textInput" placeholder="paste, type, or load a file..." spellcheck="false"></textarea>
            </div>

            <div class="actions">
                <label class="file-button" title="Load a .txt / .md file">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 3h5l5 5v9a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z" />
                        <polyline points="11 3 11 8 16 8" />
                        <line x1="10" y1="12" x2="10" y2="16" />
                        <polyline points="8 14 10 16 12 14" />
                    </svg>
                    <span class="key">$</span> load file
                    <input type="file" id="fileInput" accept=".txt,.md,.text,.rtf" />
                </label>
                <span id="fileName">no file loaded</span>
            </div>
        </section>

        <!-- Right: controls panel -->
        <section class="panel">
            <span class="panel-label accent grad-text-to-accent">[ /dev/audio ]</span>

            <div class="field">
                <label class="field-label" for="voiceSelectTrigger">voice</label>
                <div class="custom-select" data-searchable="true">
                    <button class="custom-select-trigger" id="voiceSelectTrigger" type="button" aria-haspopup="listbox">
                        <span class="custom-select-value">loading voices...</span>
                        <svg class="custom-select-caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 4.5 6 7.5 9 4.5" />
                        </svg>
                    </button>
                    <div class="custom-select-panel" role="listbox">
                        <div class="custom-select-search">
                            <input type="text" placeholder="filter voices..." aria-label="Filter voices" />
                        </div>
                        <div class="custom-select-groups"></div>
                    </div>
                </div>
                <select id="voiceSelect" aria-label="Voice" tabindex="-1"></select>
            </div>

            <div class="controls">
                <button class="btn" id="backBtn" type="button" aria-label="Previous sentence" title="Previous sentence">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="13 5 7 10 13 15" />
                        <line x1="5" y1="5" x2="5" y2="15" />
                    </svg>
                </button>

                <button class="btn primary" id="playPauseBtn" type="button" aria-label="Play">
                    <svg id="playIcon" viewBox="0 0 20 20" fill="currentColor">
                        <polygon points="5 3 17 10 5 17" />
                    </svg>
                    <svg id="pauseIcon" viewBox="0 0 20 20" fill="currentColor" style="display:none">
                        <rect x="5" y="3.5" width="3.5" height="13" rx="1" />
                        <rect x="11.5" y="3.5" width="3.5" height="13" rx="1" />
                    </svg>
                    <span id="playLabel">PLAY</span>
                </button>

                <button class="btn" id="stopBtn" type="button" aria-label="Stop" title="Stop">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <rect x="5" y="5" width="10" height="10" rx="1" />
                    </svg>
                </button>

                <button class="btn" id="nextBtn" type="button" aria-label="Next sentence" title="Next sentence">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="7 5 13 10 7 15" />
                        <line x1="15" y1="5" x2="15" y2="15" />
                    </svg>
                </button>
            </div>

            <div class="field">
                <label class="field-label" for="speedSelectTrigger">read speed</label>
                <div class="custom-select compact">
                    <button class="custom-select-trigger" id="speedSelectTrigger" type="button" aria-haspopup="listbox">
                        <span class="custom-select-value">1×</span>
                        <svg class="custom-select-caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 4.5 6 7.5 9 4.5" />
                        </svg>
                    </button>
                    <div class="custom-select-panel" role="listbox">
                        <div class="custom-select-groups"></div>
                    </div>
                </div>
                <select id="speedSelect" tabindex="-1">
                    <option value="0.75">0.75×</option>
                    <option value="0.9">0.9×</option>
                    <option value="1" selected>1×</option>
                    <option value="1.15">1.15×</option>
                    <option value="1.3">1.3×</option>
                    <option value="1.5">1.5×</option>
                    <option value="1.75">1.75×</option>
                    <option value="2">2×</option>
                </select>
            </div>

            <div class="field">
                <label class="field-label" for="volumeRange">volume</label>
                <div class="range-row">
                    <input type="range" id="volumeRange" min="0" max="1" step="0.05" value="0.85" />
                    <span id="volumeValue">85%</span>
                </div>
            </div>

            <div class="status" id="statusText" data-state="idle">
                <span class="dot"></span>
                <span class="prompt">&gt;</span>
                <span class="text">ready</span>
                <span class="position" id="positionText"></span>
            </div>

            <div class="seek-row">
                <input type="range" id="seekRange" min="1" max="1" value="1" step="1" disabled aria-label="Seek to sentence" />
            </div>
        </section>
    </main>

    <p class="foot">
        <span class="key">$</span> cat /etc/narrator — neural voices · sentence-by-sentence playback · light &amp; dark
    </p>
    <p class="foot copy">
        <span class="key">©</span> 2026 <a href="https://dimitrisofikitis.com" target="_blank" rel="noopener">Dimitris Sofikitis</a>
        / <a href="https://github.com/dSofikitis" target="_blank" rel="noopener">@dSofikitis</a>
        · <a href="https://github.com/dSofikitis/narrator/blob/main/LICENSE" target="_blank" rel="noopener">MIT License</a>
    </p>

    <!-- Audio element used for playback. Hidden; we drive it from JS. -->
    <audio id="audio" preload="auto"></audio>

    <script src="/static/app.js"></script>
</body>

</html>
